name: Apply Workbench HOTAS Autoload

on:
  push:
    branches:
      - feature/workbench-autoload-hotas
    paths:
      - 'scripts/apply_workbench_autoload.py'
      - '.github/workflows/apply-workbench-autoload.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/workbench-autoload-hotas
      - run: python scripts/apply_workbench_autoload.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Scripts/Game/HOTASDebugger/HOTASDebugger.c
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-load HOTAS config in Workbench"
            git push origin HEAD:feature/workbench-autoload-hotas
          fi
