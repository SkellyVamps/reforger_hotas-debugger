name: Fix Format Limit

on:
  push:
    branches:
      - fix/format-argument-limit
    paths:
      - 'scripts/fix_format_limit.py'
      - '.github/workflows/fix-format-limit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/format-argument-limit
      - run: python scripts/fix_format_limit.py
      - run: |
          grep -q 'Axis mapping: roll=%1 pitch=%2 throttle=%3 yaw=%4' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          ! grep -q 'axes R/P/T/Y=%7/%8/%9/%10' Scripts/Game/HOTASDebugger/HOTASDebugger.c
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Scripts/Game/HOTASDebugger/HOTASDebugger.c
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix Enforce Script Format argument limit"
            git push origin HEAD:fix/format-argument-limit
          fi
