name: Fix Workbench HOTAS Apply

on:
  push:
    branches:
      - fix/workbench-hotas-apply
    paths:
      - 'scripts/fix_workbench_hotas_apply.py'
      - '.github/workflows/fix-workbench-hotas-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/workbench-hotas-apply
      - run: python scripts/fix_workbench_hotas_apply.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Scripts/Game/HOTASDebugger/HOTASDebugger.c
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix Workbench HOTAS config application"
            git push origin HEAD:fix/workbench-hotas-apply
          fi
