name: Fix Workbench Session Reinit

on:
  push:
    branches:
      - fix/workbench-session-reinit
    paths:
      - 'scripts/fix_workbench_session_reinit.py'
      - '.github/workflows/fix-workbench-session-reinit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/workbench-session-reinit
      - run: python scripts/fix_workbench_session_reinit.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Scripts/Game/HOTASDebugger/HOTASDebugger.c
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Reinitialize HOTAS debugger after Workbench restarts"
            git push origin HEAD:fix/workbench-session-reinit
          fi
