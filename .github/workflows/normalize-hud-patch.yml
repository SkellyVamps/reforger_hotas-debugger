name: Normalize HUD Patch

on:
  push:
    branches:
      - feature/hud-customization
    paths:
      - 'scripts/normalize_hud_patch.py'
      - '.github/workflows/normalize-hud-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hud-customization
      - run: python scripts/normalize_hud_patch.py
      - run: |
          if grep -q '\\tprotected void CreateHud' Scripts/Game/HOTASDebugger/HOTASDebugger.c; then exit 1; fi
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Scripts/Game/HOTASDebugger/HOTASDebugger.c
          git commit -m "Normalize HUD customization script output"
          git push origin HEAD:feature/hud-customization
