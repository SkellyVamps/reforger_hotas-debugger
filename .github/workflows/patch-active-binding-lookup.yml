name: Patch Active Binding Lookup

on:
  push:
    branches:
      - fix/active-joystick-binding-lookup
    paths:
      - 'scripts/patch_active_binding_lookup.py'
      - '.github/workflows/patch-active-binding-lookup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/active-joystick-binding-lookup
      - run: python scripts/patch_active_binding_lookup.py
      - run: |
          grep -q 'GetActionKeybinding' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'EInputDeviceType.JOYSTICK' Scripts/Game/HOTASDebugger/HOTASDebugger.c
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Scripts/Game/HOTASDebugger/HOTASDebugger.c
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Resolve active joystick bindings from InputManager"
            git push origin HEAD:fix/active-joystick-binding-lookup
          fi
