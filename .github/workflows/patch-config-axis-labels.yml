name: Patch Config-Driven HOTAS Axis Labels

on:
  push:
    branches:
      - feature/config-driven-axis-labels
    paths:
      - 'scripts/patch_config_axis_labels.py'
      - '.github/workflows/patch-config-axis-labels.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/config-driven-axis-labels
      - run: python scripts/patch_config_axis_labels.py
      - run: |
          grep -q 'roll_label=Roll' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'RefreshAssignedAxesFromBindings' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'GetAxisSettingRowLabel' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'NormalizeAxisBinding' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'SCR_EditBoxComponent' Scripts/Game/HOTASDebugger/HOTASSettingsTab.c
          grep -q 'OnAxisLabelConfirmed' Scripts/Game/HOTASDebugger/HOTASSettingsTab.c
          grep -q 'ScheduleAxisAssignmentRefresh' Scripts/Game/HOTASDebugger/HOTASSettingsTab.c
          grep -q 'Roll Axis - Unassigned' UI/layouts/Menus/SettingsSubMenus/HOTASSettings.layout
          grep -q 'WLib_EditBox.layout' UI/layouts/Menus/SettingsSubMenus/HOTASSettings.layout
          ! grep -q 'roll_axis=' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          ! grep -q 'Name "RollAxis".*WLib_SpinBox' UI/layouts/Menus/SettingsSubMenus/HOTASSettings.layout
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Scripts/Game/HOTASDebugger/HOTASDebugger.c Scripts/Game/HOTASDebugger/HOTASSettingsTab.c UI/layouts/Menus/SettingsSubMenus/HOTASSettings.layout
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Read axis labels from active HOTAS config"
            git push origin HEAD:feature/config-driven-axis-labels
          fi
