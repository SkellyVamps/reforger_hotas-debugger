name: Patch Configurable Axes

on:
  push:
    branches:
      - feature/configurable-axis-mapping
    paths:
      - 'scripts/patch_configurable_axes.py'
      - '.github/workflows/patch-configurable-axes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/configurable-axis-mapping
      - run: python scripts/patch_configurable_axes.py
      - run: |
          grep -q 'roll_axis=0' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'pitch_axis=1' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'throttle_axis=2' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'yaw_axis=5' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'rawAxis == m_iRollAxis' Scripts/Game/HOTASDebugger/HOTASDebugger.c
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Scripts/Game/HOTASDebugger/HOTASDebugger.c
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Make flight axis mapping configurable"
            git push origin HEAD:feature/configurable-axis-mapping
          fi
