name: Patch Directional HUD Inputs

on:
  push:
    branches:
      - fix/directional-hud-inputs
    paths:
      - 'scripts/patch_directional_hud_inputs.py'
      - '.github/workflows/patch-directional-hud-inputs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/directional-hud-inputs
      - run: python scripts/patch_directional_hud_inputs.py
      - run: |
          grep -q 'EActionTrigger.VALUE, OnActionTriggered' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'GetDirectionalBindingForValue' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'return "Previous Action"' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'return "Next Action"' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'return "Sight Zeroing Up"' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'return "Sight Zeroing Down"' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'case "FreelookUp": return "Free Look Up";' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'case "FreelookRight": return "Free Look Right";' Scripts/Game/HOTASDebugger/HOTASDebugger.c
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Scripts/Game/HOTASDebugger/HOTASDebugger.c
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Split directional HOTAS inputs in HUD"
            git push origin HEAD:fix/directional-hud-inputs
          fi
