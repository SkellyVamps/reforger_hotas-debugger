name: Patch Exact HUD Position

on:
  push:
    branches:
      - feature/exact-hud-position
    paths:
      - 'scripts/patch_exact_hud_position.py'
      - '.github/workflows/patch-exact-hud-position.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/exact-hud-position
      - run: python scripts/patch_exact_hud_position.py
      - name: Validate patch
        run: |
          grep -q 'position_x=0.5' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'SetHudPositionNormalized' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'HOTASHudPositionDragHandler' Scripts/Game/HOTASDebugger/HOTASSettingsTab.c
          grep -q 'RefreshSpinBoxArrows' Scripts/Game/HOTASDebugger/HOTASSettingsTab.c
          ! grep -q 'Name "HUDPosition"' UI/layouts/Menus/SettingsSubMenus/HOTASSettings.layout
          grep -q 'HUD Position - Drag Orange Bar' UI/layouts/Menus/SettingsSubMenus/HOTASSettings.layout
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Scripts/Game/HOTASDebugger/HOTASDebugger.c Scripts/Game/HOTASDebugger/HOTASSettingsTab.c UI/layouts/Menus/SettingsSubMenus/HOTASSettings.layout
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add draggable exact HUD positioning"
            git push origin HEAD:feature/exact-hud-position
          fi
