name: Patch Free Look Axis Labels

on:
  push:
    branches:
      - feature/freelook-axis-labels
    paths:
      - 'scripts/patch_freelook_axis_labels.py'
      - '.github/workflows/patch-freelook-axis-labels.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/freelook-axis-labels
      - run: python scripts/patch_freelook_axis_labels.py
      - name: Validate Free Look label integration
        run: |
          grep -q 'freelook_up_label' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'GetFreelookSettingRowLabel' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'GetDirectionalAxisBindingFromAction("FreelookUp")' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'MakeReadableBinding(bindingsText, actionName)' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'case "FreelookUp": return "Free Look Up";' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'SetupFreelookLabelEditors' Scripts/Game/HOTASDebugger/HOTASSettingsTab.c
          grep -q 'FreelookUpAxis' UI/layouts/Menus/SettingsSubMenus/HOTASSettings.layout
          grep -q 'FreelookDownAxis' UI/layouts/Menus/SettingsSubMenus/HOTASSettings.layout
          grep -q 'FreelookRightAxis' UI/layouts/Menus/SettingsSubMenus/HOTASSettings.layout
          grep -q 'FreelookLeftAxis' UI/layouts/Menus/SettingsSubMenus/HOTASSettings.layout
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Scripts/Game/HOTASDebugger/HOTASDebugger.c Scripts/Game/HOTASDebugger/HOTASSettingsTab.c UI/layouts/Menus/SettingsSubMenus/HOTASSettings.layout
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Add configurable Free Look axis labels"
            git push origin HEAD:feature/freelook-axis-labels
          fi
