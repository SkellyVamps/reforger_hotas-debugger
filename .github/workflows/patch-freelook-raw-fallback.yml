name: Patch Free Look Raw Fallback

on:
  push:
    branches:
      - feature/freelook-axis-labels
    paths:
      - 'scripts/patch_freelook_raw_fallback.py'
      - '.github/workflows/patch-freelook-raw-fallback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/freelook-axis-labels
      - run: python scripts/patch_freelook_raw_fallback.py
      - run: |
          grep -q 'bool isFreelookDirection = actionName == "FreelookUp"' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'readable = freelookLabel;' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'readable = string.Format("AXIS %1%2", rawAxis + 1, direction);' Scripts/Game/HOTASDebugger/HOTASDebugger.c
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Scripts/Game/HOTASDebugger/HOTASDebugger.c
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Keep unlabeled Free Look axes raw"
            git push origin HEAD:feature/freelook-axis-labels
          fi
