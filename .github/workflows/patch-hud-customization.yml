name: Patch HUD Customization

on:
  push:
    branches:
      - feature/hud-customization
    paths:
      - 'scripts/patch_hud_customization.py'
      - '.github/workflows/patch-hud-customization.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hud-customization
      - run: python scripts/patch_hud_customization.py
      - run: |
          grep -q 'HOTASHudSettings.txt' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'MakeReadableBinding' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'StartFade' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'PanelWidgetTypeID' Scripts/Game/HOTASDebugger/HOTASDebugger.c
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Scripts/Game/HOTASDebugger/HOTASDebugger.c
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add configurable polished HOTAS HUD"
            git push origin HEAD:feature/hud-customization
          fi
