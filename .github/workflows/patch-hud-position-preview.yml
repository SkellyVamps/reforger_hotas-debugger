name: Patch HUD Position Preview

on:
  push:
    branches:
      - feature/hud-position-preview
    paths:
      - 'scripts/patch_hud_position_preview.py'
      - '.github/workflows/patch-hud-position-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hud-position-preview
      - run: python scripts/patch_hud_position_preview.py
      - run: |
          grep -q 'HUDPreviewPane' UI/layouts/Menus/SettingsSubMenus/HOTASSettings.layout
          grep -q 'HUDPositionPreview' UI/layouts/Menus/SettingsSubMenus/HOTASSettings.layout
          grep -q 'UpdateHudPositionPreview' Scripts/Game/HOTASDebugger/HOTASSettingsTab.c
          grep -q 'DPIUnscale' Scripts/Game/HOTASDebugger/HOTASSettingsTab.c
          grep -q 'GetSettingOptionIndex(1)' Scripts/Game/HOTASDebugger/HOTASSettingsTab.c
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Scripts/Game/HOTASDebugger/HOTASSettingsTab.c UI/layouts/Menus/SettingsSubMenus/HOTASSettings.layout
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add responsive HUD position preview"
            git push origin HEAD:feature/hud-position-preview
          fi
