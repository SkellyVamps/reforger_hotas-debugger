name: Patch HUD Sliders

on:
  push:
    branches:
      - feature/hud-scale-opacity-sliders
    paths:
      - 'scripts/patch_hud_sliders.py'
      - '.github/workflows/patch-hud-sliders.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hud-scale-opacity-sliders
      - run: python scripts/patch_hud_sliders.py
      - run: |
          grep -q 'GetHudScalePercent' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'SetBackgroundOpacityPercent' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'SCR_SliderComponent m_HudScaleSlider' Scripts/Game/HOTASDebugger/HOTASSettingsTab.c
          grep -q 'GetOnChangedFinal().Insert(OnHudScaleChanged)' Scripts/Game/HOTASDebugger/HOTASSettingsTab.c
          grep -q 'WLib_Slider.layout' UI/layouts/Menus/SettingsSubMenus/HOTASSettings.layout
          grep -q 'm_sLabel "Background Opacity"' UI/layouts/Menus/SettingsSubMenus/HOTASSettings.layout
          grep -q 'Math.Clamp(value.ToFloat(1.0), 0.6, 2.0)' Scripts/Game/HOTASDebugger/HOTASDebugger.c
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Scripts/Game/HOTASDebugger/HOTASDebugger.c Scripts/Game/HOTASDebugger/HOTASSettingsTab.c UI/layouts/Menus/SettingsSubMenus/HOTASSettings.layout
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Use sliders for HUD scale and opacity"
            git push origin HEAD:feature/hud-scale-opacity-sliders
          fi
