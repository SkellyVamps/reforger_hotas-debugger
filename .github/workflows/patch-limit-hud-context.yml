name: Patch HOTAS HUD Context

on:
  push:
    branches:
      - fix/limit-hud-aircraft-turret
    paths:
      - 'scripts/patch_limit_hud_context.py'
      - '.github/workflows/patch-limit-hud-context.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/limit-hud-aircraft-turret
      - run: python scripts/patch_limit_hud_context.py
      - run: |
          grep -q 'IsPlayerInAircraftOrTurret' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'TurretCompartmentSlot.Cast(slot)' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'PilotCompartmentSlot.Cast(slot)' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'HelicopterControllerComponent' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q '!IsPlayerInAircraftOrTurret()' Scripts/Game/HOTASDebugger/HOTASDebugger.c
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Scripts/Game/HOTASDebugger/HOTASDebugger.c
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Limit HOTAS HUD to aircraft and turrets"
            git push origin HEAD:fix/limit-hud-aircraft-turret
          fi
