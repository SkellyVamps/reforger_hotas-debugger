name: Patch Native HOTAS Settings Tab

on:
  push:
    branches:
      - feature/native-hotas-settings-tab
    paths:
      - 'scripts/patch_native_settings_tab.py'
      - '.github/workflows/patch-native-settings-tab.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-hotas-settings-tab
      - run: python scripts/patch_native_settings_tab.py
      - run: |
          ! grep -q 'LoadWorkbenchTestConfig' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          ! grep -q 'HOTASSettingsToggle' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'GetSettingOptionCount' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'SetSettingOptionIndex' Scripts/Game/HOTASDebugger/HOTASDebugger.c
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Scripts/Game/HOTASDebugger/HOTASDebugger.c
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Move HUD settings to native settings API"
            git push origin HEAD:feature/native-hotas-settings-tab
          fi
