name: Patch Non-Joystick Label

on:
  push:
    branches:
      - fix/non-joystick-input-label
    paths:
      - 'scripts/patch_non_joystick_label.py'
      - '.github/workflows/patch-non-joystick-label.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/non-joystick-input-label
      - run: python scripts/patch_non_joystick_label.py
      - run: grep -q 'return "Non-Joystick Input";' Scripts/Game/HOTASDebugger/HOTASDebugger.c
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Scripts/Game/HOTASDebugger/HOTASDebugger.c
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Show non-joystick input label"
            git push origin HEAD:fix/non-joystick-input-label
          fi
