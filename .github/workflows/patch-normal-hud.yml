name: Patch Normal HUD

on:
  push:
    branches:
      - feature/normal-hud-bottom-center
    paths:
      - 'scripts/patch_normal_hud.py'
      - '.github/workflows/patch-normal-hud.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/normal-hud-bottom-center
      - run: python scripts/patch_normal_hud.py
      - run: |
          grep -q 'WidgetFlags.CENTER' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'WidgetFlags.NO_LOCALIZATION' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'm_bDebugMode = false' Scripts/Game/HOTASDebugger/HOTASDebugger.c
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Scripts/Game/HOTASDebugger/HOTASDebugger.c
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add bottom-center normal HOTAS HUD"
            git push origin HEAD:feature/normal-hud-bottom-center
          fi
