name: Patch Readable Axes

on:
  push:
    branches:
      - feature/readable-axis-names
    paths:
      - 'scripts/patch_readable_axes.py'
      - '.github/workflows/patch-readable-axes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/readable-axis-names
      - run: python scripts/patch_readable_axes.py
      - run: |
          grep -q 'case 0: axisName = "ROLL"' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'case 1: axisName = "PITCH"' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'case 2: axisName = "THROTTLE"' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'case 5: axisName = "YAW"' Scripts/Game/HOTASDebugger/HOTASDebugger.c
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Scripts/Game/HOTASDebugger/HOTASDebugger.c
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Use flight-axis names in normal HUD"
            git push origin HEAD:feature/readable-axis-names
          fi
