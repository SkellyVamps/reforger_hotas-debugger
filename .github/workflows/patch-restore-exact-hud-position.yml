name: Restore Exact HOTAS HUD Position

on:
  push:
    branches:
      - fix/restore-exact-hud-position
    paths:
      - 'scripts/patch_restore_exact_hud_position.py'
      - '.github/workflows/patch-restore-exact-hud-position.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-exact-hud-position
      - run: python scripts/patch_restore_exact_hud_position.py
      - name: Validate restored behavior
        run: |
          grep -q 'position_x=0.5' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'SetHudPositionNormalized' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'travelX \* m_fHudPositionX' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'class HOTASHudPositionDragHandler' Scripts/Game/HOTASDebugger/HOTASSettingsTab.c
          grep -q 'HUDPreviewHost' Scripts/Game/HOTASDebugger/HOTASSettingsTab.c
          grep -q 'RefreshAllSpinBoxArrows' Scripts/Game/HOTASDebugger/HOTASSettingsTab.c
          grep -q 'e.g. Roll' Scripts/Game/HOTASDebugger/HOTASSettingsTab.c
          grep -q 'e.g. Pitch' Scripts/Game/HOTASDebugger/HOTASSettingsTab.c
          grep -q 'e.g. Throttle' Scripts/Game/HOTASDebugger/HOTASSettingsTab.c
          grep -q 'e.g. Yaw' Scripts/Game/HOTASDebugger/HOTASSettingsTab.c
          grep -q 'Name "HUDPositionPreview"' UI/layouts/Menus/SettingsSubMenus/HOTASSettings.layout
          ! grep -q 'Name "HUDPosition"' UI/layouts/Menus/SettingsSubMenus/HOTASSettings.layout
          grep -q 'm_bCycleMode 0' UI/layouts/Menus/SettingsSubMenus/HOTASSettings.layout
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Scripts/Game/HOTASDebugger/HOTASDebugger.c Scripts/Game/HOTASDebugger/HOTASSettingsTab.c UI/layouts/Menus/SettingsSubMenus/HOTASSettings.layout
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Restore draggable HUD position and bounded selectors"
            git push origin HEAD:fix/restore-exact-hud-position
          fi
