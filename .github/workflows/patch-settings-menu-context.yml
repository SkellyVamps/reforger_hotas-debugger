name: Patch HOTAS Settings and Context

on:
  push:
    branches:
      - feature/settings-menu-context-filtering
    paths:
      - 'scripts/patch_settings_menu_context.py'
      - '.github/workflows/patch-settings-menu-context.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/settings-menu-context-filtering
      - run: python scripts/patch_settings_menu_context.py
      - run: |
          grep -q 'HOTASSettingsToggle' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'GetSettingsCount' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'AdjustSetting' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'GetPlayerHotasContext' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'IsActionAllowedForContext' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'FrameSlot.SetPos(m_HudRootWidget' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'FrameSlot.SetSize(m_HudRootWidget' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'Color 0.0052 0.007 0.0091 1' UI/layouts/HUD/HOTAS/HOTASInputHUD.layout
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Scripts/Game/HOTASDebugger/HOTASDebugger.c UI/layouts/HUD/HOTAS/HOTASInputHUD.layout
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add HUD settings and context filtering"
            git push origin HEAD:feature/settings-menu-context-filtering
          fi
