name: Patch Slider Settings

on:
  push:
    branches:
      - feature/native-hotas-settings-tab
    paths:
      - 'scripts/patch_slider_settings.py'
      - '.github/workflows/patch-slider-settings.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-hotas-settings-tab
      - run: python scripts/patch_slider_settings.py
      - run: |
          grep -q 'GetHudScalePercent' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'SetHudScalePercent' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'GetBackgroundOpacityPercent' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'SetBackgroundOpacityPercent' Scripts/Game/HOTASDebugger/HOTASDebugger.c
          grep -q 'Math.Clamp(value.ToFloat(1.0), 0.6, 2.0)' Scripts/Game/HOTASDebugger/HOTASDebugger.c
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Scripts/Game/HOTASDebugger/HOTASDebugger.c
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Map HUD sliders to scale and opacity"
            git push origin HEAD:feature/native-hotas-settings-tab
          fi
