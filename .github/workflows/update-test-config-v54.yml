name: Update Workbench Test Config v5.4

on:
  push:
    branches:
      - chore/use-solr1-v5-4
    paths:
      - 'scripts/update_test_config_v54.py'
      - '.github/workflows/update-test-config-v54.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/use-solr1-v5-4
      - run: python scripts/update_test_config_v54.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Scripts/Game/HOTASDebugger/HOTASDebugger.c
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Use Solr1 v5.4 Workbench test config"
            git push origin HEAD:chore/use-solr1-v5-4
          fi
